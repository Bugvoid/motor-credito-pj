services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: credit
      POSTGRES_USER: credit
      POSTGRES_PASSWORD: credit
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U credit"]
      interval: 2s
      retries: 20

  sqs:
    # ElasticMQ: SQS compatível, local e sem conta.
    image: softwaremill/elasticmq-native:1.6.12
    volumes: ["./elasticmq/elasticmq.conf:/opt/elasticmq.conf:ro"]
    ports: ["9324:9324"]

  api:
    build:
      context: .
      dockerfile: src/CreditEngine.Api/Dockerfile
    depends_on:
      postgres: { condition: service_healthy }
      sqs: { condition: service_started }
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Postgres: Host=postgres;Database=credit;Username=credit;Password=credit
      Outbox__Enabled: "true"
      Sqs__ServiceUrl: http://sqs:9324
      Sqs__QueueUrl: http://sqs:9324/000000000000/credit-decisions
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: us-east-1
    ports: ["8080:8080"]
